# Build release on new tag creating event
---
kind: pipeline
type: docker
name: watchtower-release

trigger:
  event:
    - tag

environment:
  WATCHTOWER__RUN_MODE: integration
  REGISTRY_ADDRESS: ${REGISTRY_ADDRESS}

steps:
  - name: build-and-publish-package
    image: plugins/docker
    settings:
      repo: git.sova.local:3000/sova-core/watchtower
      registry: git.sova.local:3000
      insecure: true
      dockerfile: Dockerfile
      tags:
        - ${DRONE_COMMIT_SHA:0:8}
        - ${DRONE_TAG}
        - latest
      username:
        from_secret: GITEA_USERNAME
      password:
        from_secret: GITEA_TOKEN

  - name: build-and-push-dev-docker
    image: plugins/docker
    settings:
      repo: dev.sova.local:5000/sova-core/watchtower
      registry: dev.sova.local:5000
      dockerfile: Dockerfile
      insecure: true
      tags:
        - ${DRONE_TAG}
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD

volumes:
  - name: go-targets
    temp: {}
