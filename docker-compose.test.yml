name: test

services:
  file-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: 'minio-root'
      MINIO_ROOT_PASSWORD: 'minio-root'

  ext-file-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server --address ":9002" --console-address ":9003" /data
    ports:
      - '9002:9002'
      - '9003:9003'
    environment:
      MINIO_ROOT_USER: 'minio-root'
      MINIO_ROOT_PASSWORD: 'minio-root'

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - '5552:5552'
      - '5672:5672'
      - '15672:15672'
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq
      - ./tests/config/rmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./tests/config/rmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  redis:
    image: redis:8.6.1-trixie
    restart: unless-stopped
    ports:
      - '6379:6379'
    environment:
      REDIS_USER: 'redis'
      REDIS_PASSWORD: 'redis'
      REDIS_USER_PASSWORD: 'redis'
    volumes:
      - ./redis-data:/data
