name: documents

services:
  file-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server --address ":9000" --console-address ":9001" /data
    networks:
      - documents-net
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: 'minio-root'
      MINIO_ROOT_PASSWORD: 'minio-root'
    volumes:
      - './minio-data:/data'

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    networks:
      - documents-net
    ports:
      - '5552:5552'
      - '5672:5672'
      - '15672:15672'
    volumes:
      - './rabbitmq-data:/var/lib/rabbitmq'
      - './tests/config/rmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro'
      - './tests/config/rmq/definitions.json:/etc/rabbitmq/definitions.json:ro'

  redis:
    image: redis:8.6.1-trixie
    restart: unless-stopped
    networks:
      - documents-net
    ports:
      - '6379:6379'
    environment:
      REDIS_USER: 'redis'
      REDIS_PASSWORD: 'redis'
      REDIS_USER_PASSWORD: 'redis'
    volumes:
      - './redis-data:/data'

  watchtower:
    image: watchtower:v0.2.6
    restart: unless-stopped
    depends_on:
      - file-storage
      - rabbitmq
      - redis
    networks:
      - documents-net
    ports:
      - '2893:2893'
    env_file:
      - '.env'

networks:
  documents-net:
    name: documents-net
    driver: bridge
